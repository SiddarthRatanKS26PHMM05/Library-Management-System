<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System - Books</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Library Management System</h1>
      <p>Add and manage book records.</p>
    </header>
    <nav>
      <button type="button" id="addSectionButton">Add Book</button>
      <button type="button" class="secondary" id="recordsSectionButton">View Books</button>
      <button type="button" class="secondary" id="logoutButton">Logout</button>
    </nav>
    <section class="panel" id="formSection">
      <h2 id="formTitle">Add Book</h2>
      <form id="bookForm">
        <label for="title">Book title</label>
        <input id="title" name="title" placeholder="Enter title" required>
        <label for="author">Author</label>
        <input id="author" name="author" placeholder="Enter author" required>
        <label for="category">Category</label>
        <input id="category" name="category" placeholder="Enter category" required>
        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="0" step="1" value="1" required>
        <button type="submit" id="saveButton">Add Book</button>
        <button type="button" class="secondary" id="cancelButton" hidden>Cancel</button>
      </form>
      <p id="bookMessage" class="message" aria-live="polite"></p>
    </section>
    <section class="panel" id="recordsSection">
      <h2>Book Records</h2>
      <label for="search">Search by title or author</label>
      <input id="search" class="search" placeholder="Type a title or author">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Title</th><th>Author</th><th>Category</th><th>Quantity</th><th>Actions</th></tr>
          </thead>
          <tbody id="bookRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
